<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Goal Rush!</title>
    <meta name="description" content="Goal Rush! Build your kids' five-a-side football team and play fast top-down 3D matches. No accounts, no adverts." />
    <meta name="theme-color" content="#1b2a41" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Loading screen: plain CSS here so it shows before the game's code arrives. */
      .boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(6px, 2vh, 16px); padding: 16px; text-align: center; color: #fff8e8; font-family: 'Fredoka', system-ui, sans-serif; background: radial-gradient(circle at 50% 38%, #24406b 0%, #13233a 55%, #0b1626 100%); transition: opacity .45s ease, visibility .45s; }
      .boot.is-gone { opacity: 0; visibility: hidden; }
      .boot-crest { width: min(34vh, 46vw, 240px); height: auto; aspect-ratio: 1; border-radius: 50%; border: 4px solid #f2a03d; box-shadow: 0 6px 0 #0b1626, 0 0 40px rgba(242,106,27,.35); object-fit: cover; }
      .boot-title { margin: 0; font-weight: 700; font-size: clamp(34px, 9vmin, 72px); line-height: 1; letter-spacing: .02em; text-shadow: 0 4px 0 #0b1626; }
      .boot-title span { color: #ffd23f; }
      .boot-club { margin: 0; font-weight: 600; font-size: clamp(14px, 3.4vmin, 22px); color: #ffd9b8; max-width: 26em; }
      .boot-club strong { color: #ff8a3d; }
      .boot-bar { width: min(260px, 60vw); height: 10px; border-radius: 99px; background: rgba(255,255,255,.15); overflow: hidden; border: 2px solid rgba(255,255,255,.25); }
      .boot-bar i { display: block; width: 40%; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #f26a1b, #ffd23f); animation: boot-run 1.1s ease-in-out infinite alternate; }
      @keyframes boot-run { from { transform: translateX(-20%); } to { transform: translateX(170%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar i { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="boot" class="boot" role="status" aria-live="polite">
      <img class="boot-crest" src="/art/davao-strikers.jpg" alt="Davao Strikers FC logo" width="512" height="512" />
      <h1 class="boot-title">GOAL <span>RUSH!</span></h1>
      <p class="boot-club">The official football game of <strong>Davao Strikers FC!</strong></p>
      <div class="boot-bar" aria-hidden="true"><i></i></div>
    </div>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
